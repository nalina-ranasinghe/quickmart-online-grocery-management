spring.application.name=admin-dashboard
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# Error Handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework=INFO
logging.level.com.admin_dashboard=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File Storage Configuration
app.storage.json.path=src/main/resources/data/prime-members.json
app.storage.json.backup=true
app.storage.json.backup.path=src/main/resources/data/backup/prime-members.json

# Security (if needed later)
#spring.security.user.name=admin
#spring.security.user.password=admin
