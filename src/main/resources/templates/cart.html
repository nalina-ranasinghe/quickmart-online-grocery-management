<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - QuickMart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Color Variables */
        :root {
            --dark-green: #123523;
            --medium-green: #3E7B27;
            --light-green: #85A947;
            --cream: #EFE3C2;
            --off-white: #f8faf7;
            --text-dark: #333;
            --text-light: #777;
        }

        /* Base Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--off-white);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        .title-font {
            font-family: 'Playfair Display', serif;
        }

        /* Cart Container */
        .cart-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--cream);
        }

        .cart-header h1 {
            font-size: 2rem;
            color: var(--dark-green);
            margin: 0;
        }

        .cart-stats {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .total-items, .total-price {
            font-size: 1.1rem;
            color: var(--text-dark);
        }

        .total-price {
            font-weight: 600;
            color: var(--medium-green);
        }

        /* Cart Content */
        .cart-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        /* Cart Items */
        .cart-items {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
        }

        .cart-item {
            display: grid;
            grid-template-columns: auto 1fr auto auto auto;
            gap: 1.5rem;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 100px;
            height: 100px;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .item-details {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .item-details h3 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--dark-green);
        }

        .category {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .price {
            font-weight: 600;
            color: var(--medium-green);
        }

        .item-quantity {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quantity-btn {
            background: var(--off-white);
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quantity-btn:hover {
            background: var(--cream);
        }

        .quantity {
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        .item-total {
            font-weight: 600;
            color: var(--dark-green);
            min-width: 80px;
            text-align: right;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 0.5rem;
            transition: color 0.2s;
        }

        .remove-btn:hover {
            color: #dc3545;
        }

        /* Empty Cart */
        .empty-cart {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
        }

        .empty-cart i {
            font-size: 4rem;
            color: var(--light-green);
            margin-bottom: 1rem;
        }

        .empty-cart h2 {
            color: var(--dark-green);
            margin-bottom: 0.5rem;
        }

        .empty-cart p {
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        .continue-shopping {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: var(--medium-green);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .continue-shopping:hover {
            background: var(--dark-green);
        }

        /* Order Summary */
        .order-summary {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
            height: fit-content;
        }

        .order-summary h2 {
            color: var(--dark-green);
            margin: 0 0 1.5rem 0;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--cream);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: var(--text-dark);
        }

        .summary-row.total {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--dark-green);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background: var(--dark-green);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            margin-top: 1.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkout-btn:hover {
            background: #0c2a1a;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .cart-content {
                grid-template-columns: 1fr;
            }

            .cart-item {
                grid-template-columns: auto 1fr;
                gap: 1rem;
            }

            .item-quantity, .item-total, .remove-btn {
                grid-column: 2;
            }

            .item-quantity {
                justify-content: flex-start;
            }

            .item-total {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div th:replace="header :: header"></div>

    <div class="cart-container">
        <div class="cart-header">
            <h1>Shopping Cart</h1>
            <div class="cart-stats">
                <span class="total-items" th:text="${totalItems} + ' items'">0 items</span>
            </div>
        </div>

        <div class="cart-content">
            <div class="cart-items" th:if="${not #lists.isEmpty(cartItems)}">
                <div class="cart-item" th:each="item : ${cartItems}">
                    <div class="item-image">
                        <img th:src="${item.image}" th:alt="${item.name}">
                    </div>
                    <div class="item-details">
                        <h3 th:text="${item.name}">Product Name</h3>
                        <p class="category" th:text="${item.category}">Category</p>
                        <p class="price" th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 2)}">$0.00</p>
                    </div>
                    <div class="item-quantity">
                        <button class="quantity-btn" onclick="updateQuantity(this, -1)" th:data-id="${item.id}">-</button>
                        <span class="quantity" th:text="${item.quantity}">1</span>
                        <button class="quantity-btn" onclick="updateQuantity(this, 1)" th:data-id="${item.id}">+</button>
                    </div>
                    <div class="item-total">
                        <span th:text="'$' + ${#numbers.formatDecimal(item.price * item.quantity, 1, 2)}">$0.00</span>
                    </div>
                    <button class="remove-btn" onclick="removeItem(this)" th:data-id="${item.id}">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>

            <div class="empty-cart" th:if="${#lists.isEmpty(cartItems)}">
                <i class="fas fa-shopping-cart"></i>
                <h2>Your cart is empty</h2>
                <p>Add some items to your cart to see them here</p>
                <a href="/products" class="continue-shopping">Continue Shopping</a>
            </div>

            <div class="order-summary" th:if="${not #lists.isEmpty(cartItems)}">
                <h2>Order Summary</h2>
                <div class="summary-row">
                    <span>Delivery Fee</span>
                    <span th:text="${totalPrice >= 50 ? 'Free' : '$5.00'}">$5.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span th:text="'$' + ${#numbers.formatDecimal(totalPrice >= 50 ? totalPrice : totalPrice + 5, 1, 2)}">$0.00</span>
                </div>
                <div class="cart-actions">
                    <button class="checkout-btn" onclick="window.location.href='/checkout'">
                        <i class="fas fa-shopping-cart"></i> Proceed to Checkout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="footer :: footer"></div>

    <script>
        function updateQuantity(button, change) {
            const itemId = button.dataset.id;
            const quantityElement = button.parentElement.querySelector('.quantity');
            const currentQuantity = parseInt(quantityElement.textContent);
            const newQuantity = Math.max(1, currentQuantity + change);

            fetch(`/cart/update/${itemId}?quantity=${newQuantity}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    quantityElement.textContent = newQuantity;
                    updateCartTotals(data);
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function removeItem(button) {
            const itemId = button.dataset.id;
            const cartItem = button.closest('.cart-item');

            fetch(`/cart/remove/${itemId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    cartItem.remove();
                    updateCartTotals(data);
                    if (data.totalItems === 0) {
                        location.reload();
                    }
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function updateCartTotals(data) {
            document.querySelector('.total-items').textContent = `${data.totalItems} items`;
            
            const deliveryFee = data.totalPrice >= 50 ? 0 : 5;
            const total = data.totalPrice + deliveryFee;
            
            document.querySelector('.summary-row.total span:last-child').textContent = `$${total.toFixed(2)}`;
            document.querySelector('.summary-row:nth-child(1) span:last-child').textContent = 
                deliveryFee === 0 ? 'Free' : '$5.00';
        }
    </script>
</body>
</html>
