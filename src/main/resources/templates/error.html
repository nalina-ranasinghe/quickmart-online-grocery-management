<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - QuickMart Admin</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#123523',
                        secondary: '#3E7B27',
                        tertiary: '#85A947',
                        accent: '#EFE3C2',
                        offwhite: '#F8F8F5',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            min-height: 100vh;
            background-color: #F8F8F5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            max-width: 500px;
            padding: 2rem;
            text-align: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #123523;
            line-height: 1;
        }
        .error-message {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #3E7B27;
        }
        .btn-primary {
            background-color: #3E7B27 !important;
            border-color: #3E7B27 !important;
        }
        .btn-primary:hover {
            background-color: #123523 !important;
            border-color: #123523 !important;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <img src="/images/QUICKMART_logo.png" alt="QuickMart Logo" style="width: 150px; margin: 0 auto 2rem;">
        
        <div class="error-code" th:text="${status ?: '404'}">404</div>
        <div class="error-message" th:text="${message ?: 'Page Not Found'}">Page Not Found</div>
        <p class="mb-4">We're sorry, but the page you are looking for cannot be found.</p>
        
        <div class="mt-5">
            <a href="/admin/login" class="btn btn-primary">
                <i class="fas fa-home me-2"></i> Go to Login
            </a>
        </div>
    </div>
</body>
</html>
