<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shopping Cart</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Shopping Cart</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <h2>Products</h2>
                <div class="row">
                    <div th:each="product : ${products}" class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                                <p class="card-text">
                                    Price: $<span th:text="${product.price}">0.00</span><br>
                                    Stock: <span th:text="${product.stock}">0</span>
                                </p>
                                <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" class="d-flex">
                                    <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}" class="form-control me-2" style="width: 80px">
                                    <button type="submit" class="btn btn-primary">Add to Cart</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <h2>Cart</h2>
                <div class="list-group">
                    <div th:each="item : ${cartItems}" class="list-group-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 th:text="${item.product.name}">Product Name</h6>
                                <small>
                                    Quantity: <span th:text="${item.quantity}">0</span><br>
                                    Price: $<span th:text="${item.price}">0.00</span>
                                </small>
                            </div>
                            <div>
                                <span class="h6">$<span th:text="${item.total}">0.00</span></span>
                                <a th:href="@{/cart/remove/{id}(id=${item.id})}" class="btn btn-sm btn-danger ms-2">Remove</a>
                            </div>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(cartItems)}" class="list-group-item">
                        <p class="mb-0">Your cart is empty</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
