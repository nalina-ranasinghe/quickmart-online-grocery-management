<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quick Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .dashboard-container {
            margin-top: 40px;
        }
        .item-card {
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 24px;
            background: #fff;
            margin-bottom: 24px;
            text-align: center;
        }
        .item-card img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 16px;
        }
        .item-card h5 {
            color: #2d5e2d;
            font-weight: 700;
        }
        .item-card p {
            color: #555;
        }
        .nav-link {
            color: var(--dark-green);
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: inline-block;
            margin: 5px;
        }
        .nav-link:hover {
            background-color: var(--cream);
            color: var(--medium-green);
        }
        .management-link {
            background-color: var(--medium-green);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
            margin: 10px 0;
        }
        .management-link:hover {
            background-color: var(--dark-green);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="#">Quick Mart</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="/api/users/management">User Management</a>
                <a class="nav-link text-white" href="/logout">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container dashboard-container">
        <h2 class="mb-4">Available Grocery Items</h2>
        <div class="row">
            <!-- Example items, replace with dynamic content as needed -->
            <div class="col-md-4">
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=100&q=80" alt="Apple">
                    <h5>Apple</h5>
                    <p>Fresh and juicy apples.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1464306076886-debca5e8a6b0?auto=format&fit=crop&w=100&q=80" alt="Broccoli">
                    <h5>Broccoli</h5>
                    <p>Green and healthy broccoli.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1519864600265-abb23847ef2c?auto=format&fit=crop&w=100&q=80" alt="Bread">
                    <h5>Bread</h5>
                    <p>Freshly baked bread loaf.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
