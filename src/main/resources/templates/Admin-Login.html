<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMart Admin - Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#123523',
                        secondary: '#3E7B27',
                        tertiary: '#85A947',
                        accent: '#EFE3C2',
                        offwhite: '#F8F8F5',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8F8F5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 900px;
            display: flex;
        }
        .login-form {
            padding: 40px;
            width: 50%;
        }
        .login-image {
            width: 50%;
            background-color: #123523;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .btn-primary {
            background-color: #3E7B27 !important;
            border-color: #3E7B27 !important;
        }
        .btn-primary:hover {
            background-color: #123523 !important;
            border-color: #123523 !important;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-image">
        <div class="text-center">
            <img src="/images/QUICKMART_logo.png" alt="QuickMart Logo" style="max-width: 200px; margin-bottom: 20px;">
            <h2 class="text-white font-bold text-2xl mb-3">Admin Dashboard</h2>
            <p class="text-offwhite opacity-80">Manage your store efficiently</p>
        </div>
    </div>
    <div class="login-form">
        <div class="text-center mb-4">
            <h1 class="text-2xl font-bold text-primary">Admin Login</h1>
            <p class="text-gray-600">Please enter your credentials</p>
        </div>
        <form id="loginForm" action="/admin/home" method="post">
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Admin Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <i class="fas fa-user text-gray-400"></i>
                    </div>
                    <input type="text" id="username" name="username" class="pl-10 block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary focus:ring-opacity-50 py-2 px-3 border" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Admin Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <i class="fas fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" id="password" name="password" class="pl-10 block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary focus:ring-opacity-50 py-2 px-3 border" required>
                </div>
            </div>
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center">
                    <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-secondary focus:ring-secondary border-gray-300 rounded">
                    <label for="remember" class="ml-2 block text-sm text-gray-700">Remember me</label>
                </div>
                <a href="#" class="text-sm text-secondary hover:underline">Forgot password?</a>
            </div>
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-secondary hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary">
                Sign in <i class="fas fa-sign-in-alt ml-2"></i>
            </button>
        </form>
        <div class="text-center mt-5">
            <p class="text-sm text-gray-600">© 2025 QuickMart Grocery Store System</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Form is now handled by the server - no client-side validation needed
</script>
</body>
</html>
