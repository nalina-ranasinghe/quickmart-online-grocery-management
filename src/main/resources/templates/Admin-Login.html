<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMart Admin - Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#123523',
                        secondary: '#3E7B27',
                        tertiary: '#85A947',
                        accent: '#EFE3C2',
                        offwhite: '#F8F8F5',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #123523 0%, #3E7B27 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(255,255,255,0.13);
            border-radius: 1.1rem;
            box-shadow: 0 4px 24px 0 rgba(31, 38, 135, 0.10);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.18);
            overflow: hidden;
            max-width: 950px;
            display: flex;
            width: 100%;
        }
        .login-image {
            width: 50%;
            background: linear-gradient(160deg, #123523 70%, #3E7B27 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 12px;
            min-height: 500px;
        }
        .login-image img {
            max-width: 140px;
            margin-bottom: 18px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .login-image .brand-title {
            color: #3E7B27;
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .login-image .brand-desc {
            color: #EFE3C2;
            font-size: 1.05rem;
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .login-form {
            position: relative;
            padding: 48px 40px 40px 40px;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(90deg, rgba(217, 217, 217, 0.97) 90%, rgb(220, 219, 219) 100%);
        }
        .form-floating {
            position: relative;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        .input-group-flex {
            display: flex;
            align-items: stretch;
            width: 100%;
            background: #f6f9ff;
            border-radius: 0.7rem;
            border: 1.5px solid #E5E7EB;
            box-shadow: 0 2px 8px 0 rgba(18,53,35,0.04);
        }
        .input-group-icon {
            width: 2.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eaf2fa;
            border-top-left-radius: 0.7rem;
            border-bottom-left-radius: 0.7rem;
            color: #85A947;
            font-size: 1.25rem;
        }
        .form-floating input {
            flex: 1 1 0%;
            border: none;
            outline: none;
            background: transparent;
            padding: 1.1rem 2.5rem 1.1rem 0.5rem;
            font-size: 1.08rem;
            line-height: 1.5;
            border-top-right-radius: 0.7rem;
            border-bottom-right-radius: 0.7rem;
        }
        .form-floating input:focus {
            background: #fff;
        }
        .form-floating label {
            position: absolute;
            left: 3.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #7a7a7a;
            font-size: 1rem;
            pointer-events: none;
            background: transparent;
            padding: 0 4px;
            transition: all 0.2s;
        }
        .form-floating input:focus + label,
        .form-floating input:not(:placeholder-shown) + label {
            top: 0.2rem;
            left: 3.2rem;
            font-size: 0.85rem;
            color: #3E7B27;
            background: #fff;
            padding: 0 4px;
        }
        .toggle-password {
            position: absolute;
            right: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
            z-index: 2;
            font-size: 1.1rem;
        }
        .btn-primary {
            background: linear-gradient(90deg, #3E7B27 60%, #85A947 100%) !important;
            border: none !important;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 0.7rem;
            box-shadow: 0 2px 8px 0 rgba(18,53,35,0.08);
            transition: background 0.2s, transform 0.2s;
        }
        .btn-primary:hover {
            background: #123523 !important;
            transform: translateY(-2px) scale(1.03);
        }
        .login-form h1 {
            color: #123523;
            font-weight: 800;
            letter-spacing: 0.01em;
        }
        .login-form .subtitle {
            color: #3E7B27;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        .forgot-link {
            color: #3E7B27;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .forgot-link:hover {
            text-decoration: underline;
            color: #123523;
        }
        .remember-label {
            color: #234d2e;
            font-weight: 500;
        }
        @media (max-width: 900px) {
            .glass-card {
                flex-direction: column;
                max-width: 95vw;
            }
            .login-image, .login-form {
                width: 100%;
            }
            .login-image {
                padding: 24px 0 0 0;
            }
            .login-form {
                padding: 32px 18px 28px 18px;
            }
        }
        @media (max-width: 600px) {
            .glass-card {
                border-radius: 0.7rem;
                padding: 0;
            }
            .login-form {
                padding: 18px 6px 18px 6px;
            }
        }
    </style>
</head>
<body>
<div class="glass-card">
    <div class="login-image">
        <img src="/images/QUICKMART_logo.png" alt="QuickMart Logo">
        <div class="brand-title">QUICKMART</div>
        <div class="brand-desc">Fresh. Quick. Easy.</div>
        <h2 class="text-white font-bold text-2xl mb-3" style="margin-top: 1.5rem;">Admin Dashboard</h2>
        <p class="text-accent opacity-90">Manage your store efficiently</p>
    </div>
    <div class="login-form">
        <div class="text-center mb-5">
            <h1 class="text-3xl font-extrabold mb-1">Admin Login</h1>
            <div class="subtitle">Please enter your credentials</div>
        </div>
        <form id="loginForm" action="/admin/home" method="post" autocomplete="off">
            <div class="form-floating">
                <div class="input-group-flex">
                    <div class="input-group-icon"><i class="fas fa-user"></i></div>
                    <input type="text" id="username" name="username" class="form-control" placeholder=" " required autocomplete="username">
                </div>
                <label for="username">Admin Username</label>
            </div>
            <div class="form-floating" style="position:relative;">
                <div class="input-group-flex">
                    <div class="input-group-icon"><i class="fas fa-lock"></i></div>
                    <input type="password" id="password" name="password" class="form-control" placeholder=" " required autocomplete="current-password">
                    <span class="toggle-password" onclick="togglePassword()"><i class="fas fa-eye" id="toggleIcon"></i></span>
                </div>
                <label for="password">Admin Password</label>
            </div>
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center">
                    <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-secondary focus:ring-secondary border-gray-300 rounded">
                    <label for="remember" class="ml-2 block text-sm remember-label">Remember me</label>
                </div>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-base font-semibold text-white btn-primary transition-all duration-200">
                Sign in <i class="fas fa-sign-in-alt ml-2"></i>
            </button>
        </form>
        <div class="text-center mt-6">
            <p class="text-sm text-gray-600">© 2025 QuickMart Grocery Store System</p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword() {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('toggleIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            pwd.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
</body>
</html>
