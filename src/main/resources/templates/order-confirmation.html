<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - QuickMart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Color Variables */
        :root {
            --dark-green: #123523;
            --medium-green: #3E7B27;
            --light-green: #85A947;
            --cream: #EFE3C2;
            --off-white: #f8faf7;
            --text-dark: #333;
            --text-light: #777;
        }

        /* Base Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--off-white);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        /* Confirmation Container */
        .confirmation-container {
            max-width: 800px;
            margin: 4rem auto;
            padding: 0 20px;
            text-align: center;
        }

        /* Success Icon */
        .success-icon {
            width: 100px;
            height: 100px;
            background-color: var(--light-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }

        .success-icon i {
            font-size: 50px;
            color: white;
        }

        /* Confirmation Message */
        .confirmation-message {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .confirmation-message h1 {
            color: var(--dark-green);
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .confirmation-message p {
            color: var(--text-light);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        /* Order Details */
        .order-details {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .order-details h2 {
            color: var(--dark-green);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--cream);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-light);
            font-weight: 500;
        }

        .detail-value {
            color: var(--text-dark);
            font-weight: 600;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--dark-green);
            color: white;
        }

        .btn-primary:hover {
            background: #0c2a1a;
        }

        .btn-secondary {
            background: var(--cream);
            color: var(--dark-green);
        }

        .btn-secondary:hover {
            background: #e6d9b8;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .confirmation-container {
                margin: 2rem auto;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div th:replace="header :: header"></div>

    <div class="confirmation-container">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>

        <div class="confirmation-message">
            <h1>Order Confirmed!</h1>
            <p>Thank you for your purchase. Your order has been successfully placed.</p>
        </div>

        <div class="order-details">
            <h2>Order Details</h2>
            <div class="detail-row">
                <span class="detail-label">Order Number</span>
                <span class="detail-value" th:text="${#strings.randomAlphanumeric(8).toUpperCase()}">ORD123456</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Order Date</span>
                <span class="detail-value" th:text="${#temporals.format(#temporals.createNow(), 'dd MMM yyyy, HH:mm')}">21 Mar 2024, 14:30</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Total Amount</span>
                <span class="detail-value" th:text="'$' + ${#numbers.formatDecimal(totalAmount, 1, 2)}">$0.00</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Payment Method</span>
                <span class="detail-value">Credit Card</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Delivery Address</span>
                <span class="detail-value" th:text="${address}">123 Main St, City, ZIP</span>
            </div>
        </div>

        <div class="action-buttons">
            <a href="/products" class="btn btn-primary">
                <i class="fas fa-shopping-bag"></i> Continue Shopping
            </a>
            <a href="/orders" class="btn btn-secondary">
                <i class="fas fa-list"></i> View Orders
            </a>
        </div>
    </div>

    <div th:replace="footer :: footer"></div>
</body>
</html>
