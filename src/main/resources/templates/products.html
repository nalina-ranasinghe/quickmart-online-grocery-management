<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Mart - Fresh Groceries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap');
        
        :root {
            --dark-green: #123523;
            --medium-green: #3E7B27;
            --light-green: #85A947;
            --cream: #EFE3C2;
            --off-white: #f8faf7;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--off-white);
        }
        
        .title-font {
            font-family: 'Playfair Display', serif;
        }
        
        .greenhouse-gradient {
            background: linear-gradient(135deg, var(--cream) 0%, var(--light-green) 50%, var(--medium-green) 100%);
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .sort-btn.active {
            background-color: var(--medium-green);
            color: white;
        }
        
        .admin-panel {
            background: #f8f9fa;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        
        .product-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .product-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .edit-btn {
            background-color: #ffc107;
        }
        
        .delete-btn {
            background-color: #dc3545;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleGlow {
            0% { opacity: 0; transform: scale(0.7); text-shadow: none; }
            60% { opacity: 1; transform: scale(1.1); text-shadow: 0 0 24px #EFE3C2, 0 0 8px #85A947; }
            100% { opacity: 1; transform: scale(1); text-shadow: 0 0 12px #EFE3C2, 0 0 4px #85A947; }
        }
        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .animate-fadeIn { animation: fadeIn 1s ease; }
        .animate-slideIn { animation: slideIn 1s 0.2s both; }
        .animate-scaleGlow { animation: scaleGlow 1.2s 0.7s both; }
        .animate-bgMove { animation: bgMove 3s linear infinite alternate; background-size: 200% 200%; }
        
        #welcome-overlay.fade-out {
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.7s, transform 0.7s;
        }
        
        .welcome-box {
            box-shadow: 0 8px 40px 0 rgba(30,60,30,0.25), 0 1.5px 8px 0 rgba(133,169,71,0.10);
            border-radius: 2rem;
            min-width: 260px;
            max-width: 90vw;
            text-align: center;
        }
        @media (max-width: 600px) {
            .welcome-title { font-size: 2rem; }
            .welcome-brand { font-size: 2.5rem; }
            .welcome-box { padding: 2rem 1rem; }
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Include Header -->
    <div th:replace="header :: header"></div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Category Filter -->
        <div class="mb-8">
            <h2 class="title-font text-2xl font-semibold text-[#123523] mb-4">Our Fresh Products</h2>
            <div class="flex flex-wrap gap-2 mb-6">
                <button class="category-filter px-4 py-2 rounded-full border border-[#85A947] hover:bg-[#EFE3C2] active" data-category="all">All Products</button>
                <button class="category-filter px-4 py-2 rounded-full border border-[#85A947] hover:bg-[#EFE3C2]" data-category="Fresh Produce">Fresh Produce</button>
                <button class="category-filter px-4 py-2 rounded-full border border-[#85A947] hover:bg-[#EFE3C2]" data-category="Dairy & Eggs">Dairy & Eggs</button>
                <button class="category-filter px-4 py-2 rounded-full border border-[#85A947] hover:bg-[#EFE3C2]" data-category="Meat & Seafood">Meat & Seafood</button>
                <button class="category-filter px-4 py-2 rounded-full border border-[#85A947] hover:bg-[#EFE3C2]" data-category="Pantry Staples">Pantry Staples</button>
                <button class="category-filter px-4 py-2 rounded-full border border-[#85A947] hover:bg-[#EFE3C2]" data-category="Snacks & Beverages">Snacks & Beverages</button>
            </div>
            
            <!-- Sort Controls -->
            <div class="flex justify-between items-center mb-6">
                <div class="text-gray-600">
                    <span id="product-count">0</span> products available
                </div>
            </div>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Products will be dynamically inserted here -->
        </div>
    </main>

    <!-- Include Footer -->
    <div th:replace="footer :: footer"></div>

    <div id="welcome-overlay" class="fixed inset-0 flex items-center justify-center bg-[#123523] bg-opacity-90 z-50 transition-opacity duration-700 opacity-0 pointer-events-none">
        <h1 class="text-5xl md:text-6xl font-bold text-white title-font animate-fadeIn">Welcome to <span class="text-[#85A947]">QUICKMART</span></h1>
    </div>

    <script>
        // Cart state
        let cart = [];
        let products = [];
        
        // DOM elements
        const productGrid = document.getElementById('product-grid');
        const cartCount = document.getElementById('cart-count');
        const productCount = document.getElementById('product-count');
        const categoryFilters = document.querySelectorAll('.category-filter');
        const welcomeOverlay = document.getElementById('welcome-overlay');
        
        // Show welcome overlay, then load products
        document.addEventListener('DOMContentLoaded', () => {
            // Fade in overlay
            welcomeOverlay.style.opacity = '1';
            welcomeOverlay.style.pointerEvents = 'auto';
            setTimeout(() => {
                // Fade out overlay
                welcomeOverlay.style.opacity = '0';
                welcomeOverlay.style.pointerEvents = 'none';
                setTimeout(() => {
                    welcomeOverlay.style.display = 'none';
                    // Now load products and set up listeners
                    loadProducts().then(() => {
                        updateProductCount(products.length);
                        categoryFilters.forEach(button => {
                            button.addEventListener('click', filterProductsByCategory);
                        });
                    });
                }, 700); // match transition duration
            }, 2000); // show for 2 seconds
        });
        
        // Load products from the API
        async function loadProducts() {
            try {
                const response = await fetch('/products/api');
                products = await response.json();
                displayProducts(products);
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }
        
        // Display products in the grid
        function displayProducts(productsToShow) {
            productGrid.innerHTML = '';
            productsToShow.forEach(product => {
                const productCard = createProductCard(product);
                productGrid.appendChild(productCard);
            });
        }
        
        // Create a product card element
        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card bg-white rounded-lg shadow-md overflow-hidden transition-all duration-300';
            card.innerHTML = `
                <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h3 class="font-semibold text-lg mb-2">${product.name}</h3>
                    <p class="text-gray-600 text-sm mb-2">${product.category}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-[#3E7B27] font-bold">$${product.price.toFixed(2)}</span>
                        <button onclick="addToCart(${product.id})" class="bg-[#85A947] text-white px-3 py-1 rounded-full text-sm hover:bg-[#3E7B27] transition-colors">
                            Add to Cart
                        </button>
                    </div>
                </div>
            `;
            return card;
        }
        
        // Filter products by category
        function filterProductsByCategory(event) {
            const category = event.target.dataset.category;
            
            // Update active button
            categoryFilters.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Filter products
            const filteredProducts = category === 'all' 
                ? products 
                : products.filter(product => product.category === category);
            
            displayProducts(filteredProducts);
            updateProductCount(filteredProducts.length);
        }
        
        // Update product count display
        function updateProductCount(count) {
            productCount.textContent = count;
        }
        
        // Add product to cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                cart.push(product);
                updateCartCount();
                // Show success message
                alert(`${product.name} added to cart!`);
            }
        }
        
        // Update cart count display
        function updateCartCount() {
            cartCount.textContent = cart.length;
        }
    </script>
</body>
</html>
