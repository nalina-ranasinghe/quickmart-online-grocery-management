<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Login & Registration</title>
    <style>
        :root {
            --dark-green: #123523;
            --medium-green: #3E7B27;
            --light-green: #85A947;
            --cream: #EFE3C2;
            --off-white: #F8F8F2;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--off-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--dark-green), var(--medium-green));
            position: relative;
        }
        .background-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }
        .shape:nth-child(1) {
            width: 400px;
            height: 400px;
            top: -150px;
            left: -100px;
        }
        .shape:nth-child(2) {
            width: 300px;
            height: 300px;
            bottom: -100px;
            right: -50px;
        }
        .shape:nth-child(3) {
            width: 200px;
            height: 200px;
            bottom: 30%;
            left: 10%;
            background: rgba(133, 169, 71, 0.1);
        }
        .shape:nth-child(4) {
            width: 150px;
            height: 150px;
            top: 30%;
            right: 20%;
            background: rgba(239, 227, 194, 0.1);
        }
        .container {
            position: relative;
            z-index: 1;
            width: 800px;
            min-height: 500px;
            background: var(--off-white);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            display: flex;
            overflow: hidden;
            margin: 40px 0;
        }
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--medium-green), var(--light-green));
            color: var(--off-white);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .brand-imagery {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 0;
        }
        .logo-img {
            display: block;
            margin: 0 auto 18px auto;
            width: 90px;
            height: auto;
        }
        .person-image {
            position: static;
            width: 260px;
            height: auto;
            z-index: 2;
            display: block;
            margin: 0 auto 10px auto;
        }
        .left-panel::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%);
            z-index: 0;
        }
        .left-panel h2 {
            font-size: 36px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .left-panel p {
            font-size: 16px;
            text-align: center;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }
        .form-container {
            flex: 1.5;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .form-heading {
            margin-bottom: 30px;
            text-align: center;
        }
        .form-heading h2 {
            color: var(--dark-green);
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .form-heading p {
            color: #777;
            font-size: 16px;
        }
        .input-group {
            margin-bottom: 24px;
            position: relative;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark-green);
            font-weight: 500;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #f9f9f9;
            color: #333;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--medium-green);
            box-shadow: 0 0 0 3px rgba(133, 169, 71, 0.2);
            background-color: #fff;
        }
        .button {
            background: linear-gradient(to right, var(--medium-green), var(--light-green));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 10px auto 0 auto;
            position: relative;
            overflow: hidden;
            display: block;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .button::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: -100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        .button:hover::after {
            left: 100%;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }
        .footer-text a {
            color: var(--medium-green);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .footer-text a:hover {
            color: var(--dark-green);
            text-decoration: underline;
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
        }
        #loginForm {
            display: block;
        }
        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column;
                width: 95%;
                height: auto;
            }
            .left-panel {
                padding: 30px;
            }
            .form-container {
                padding: 30px;
            }
            .brand-imagery {
                height: 160px;
            }
            .person-image {
                width: 100px;
            }
        }
        /* Password strength indicator */
        .password-strength {
            height: 5px;
            margin-top: 8px;
            border-radius: 3px;
            background-color: #ddd;
            position: relative;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            width: 0;
            border-radius: 3px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        /* Password matching indicator for registration */
        .password-match {
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .match-success {
            color: var(--medium-green);
        }
        .match-error {
            color: #e74c3c;
        }
        .login-logo {
            display: block;
            margin: 0 auto 18px auto;
            width: 70px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="background-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <div class="container">
        <div class="left-panel">
            <div class="brand-imagery">
                <img src="/man.png" alt="Person" class="person-image" />
            </div>
            <h2>Welcome</h2>
            <h3>Quick Mart</h3>
        </div>
        <div class="form-container">
            <!-- Login Form -->
            <div class="form active" id="loginForm">
                <div class="form-heading">
                    <img src="/logo1.png" alt="Quick Mart Logo" class="login-logo" />
                    <h2>Login</h2>
                    <p>Enter your credentials to access your account</p>
                </div>
                <form action="/login" method="post">
                    <div class="input-group">
                        <label for="loginEmail">Username or Email</label>
                        <input type="text" id="loginEmail" name="username" placeholder="Enter your username or email" required>
                    </div>
                    <div class="input-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="button">Login</button>
                    <div class="footer-text">
                        Don't have an account? <a href="#" id="showRegister">Sign up</a>
                    </div>
                </form>
            </div>
            <!-- Registration Form -->
            <div class="form" id="registerForm">
                <div class="form-heading">
                    <h2>Create Account</h2>
                    <p>Register to get started with us</p>
                </div>
                <form action="/register" method="post">
                    <div class="input-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="username" placeholder="Enter your full name" required>
                    </div>
                    <div class="input-group">
                        <label for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" name="password" placeholder="Create a password" required>
                        <div class="password-strength">
                            <div class="password-strength-bar"></div>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                        <div class="password-match"></div>
                    </div>
                    <button type="submit" class="button">Create Account</button>
                    <div class="footer-text">
                        Already have an account? <a href="#" id="showLogin">Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        // Toggle between login and registration forms
        document.getElementById('showRegister').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('loginForm').classList.remove('active');
            document.getElementById('registerForm').classList.add('active');
        });
        document.getElementById('showLogin').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('registerForm').classList.remove('active');
            document.getElementById('loginForm').classList.add('active');
        });
        // Password strength indicator
        document.getElementById('registerPassword').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.querySelector('.password-strength-bar');
            // Simple password strength calculation
            let strength = 0;
            if (password.length > 6) strength += 20;
            if (password.match(/[A-Z]/)) strength += 20;
            if (password.match(/[a-z]/)) strength += 20;
            if (password.match(/[0-9]/)) strength += 20;
            if (password.match(/[^A-Za-z0-9]/)) strength += 20;
            strengthBar.style.width = strength + '%';
            if (strength < 40) {
                strengthBar.style.backgroundColor = '#e74c3c'; // Red
            } else if (strength < 70) {
                strengthBar.style.backgroundColor = '#f39c12'; // Orange
            } else {
                strengthBar.style.backgroundColor = '#2ecc71'; // Green
            }
        });
        // Password matching check
        const registerPassword = document.getElementById('registerPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const passwordMatch = document.querySelector('.password-match');
        confirmPassword.addEventListener('input', function() {
            if (this.value.length > 0) {
                passwordMatch.style.display = 'block';
                if (this.value === registerPassword.value) {
                    passwordMatch.textContent = 'Passwords match';
                    passwordMatch.className = 'password-match match-success';
                } else {
                    passwordMatch.textContent = 'Passwords do not match';
                    passwordMatch.className = 'password-match match-error';
                }
            } else {
                passwordMatch.style.display = 'none';
            }
        });
    </script>
</body>
</html>
